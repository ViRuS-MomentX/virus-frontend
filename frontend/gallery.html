<head>

<link rel="manifest" href="icons/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&text=IRL&display=swap" rel="stylesheet" />

</head>
<body class="gallery-page">

<div class="topbar">
  <div class="wrapper">
    <div class="brand">virus<span>/</span>gallery</div>
    <nav class="topbar-nav">
      <a href="index.html">главная</a>
      <a href="gallery.html" class="on">галерея</a>
      <a href="projects.html">проекты</a>
      <a href="posts.html">интерактив</a>
    </nav>
  </div>
</div>

<div class="page-head">
  <div class="wrapper page-head-top">
    <div class="page-title">
      <h1>Галерея</h1>
      <p>Скриншоты с серверов и из жизни. Приглядись к каждому — в подписи обычно есть послание.</p>
    </div>
    <div class="head-count" id="photoCounter">Показано: 0 / 0</div>
  </div>

  <div class="wrapper">
    <div class="controls">

    <div class="row">
      <div class="row-key">игра</div>
      <div class="row-val">
        <div class="game-filters">
          <button class="game-filter active" data-game="" data-label="Все игры" aria-label="Все игры">
            <img src="images/all.png" alt="" width="22" height="22" loading="eager">
          </button>
          <button class="game-filter" data-game="minecraft" data-label="Minecraft" aria-label="Minecraft">
            <img src="images/minecraft.png" alt="" width="22" height="22" loading="eager">
          </button>
          <button class="game-filter" data-game="roblox" data-label="Roblox" aria-label="Roblox">
            <img src="images/roblox.png" alt="" width="22" height="22" loading="eager">
          </button>
          <button class="game-filter" data-game="phasmo" data-label="Phasmophobia" aria-label="Phasmophobia">
            <img src="images/phasmo.ico" alt="" width="22" height="22" loading="eager">
          </button>
          <button class="game-filter" data-game="rivals" data-label="Marvel Rivals" aria-label="Marvel Rivals">
            <img src="images/marvel.png" alt="" width="22" height="22" loading="eager">
          </button>
          <button class="game-filter" data-game="dbd" data-label="Dead by Daylight" aria-label="Dead by Daylight">
            <img src="images/dbd.jpg" alt="" width="22" height="22" loading="eager">
          </button>
          <button class="game-filter is-irl" data-game="irl" data-label="Из реальной жизни" aria-label="Из реальной жизни">
            <span aria-hidden="true">IRL</span>
          </button>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="row-key">поиск</div>
      <div class="row-val">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="искать по подписи" autocomplete="off" />
          <button class="shuffle-button" id="shuffleButton">перемешать</button>
        </div>
      </div>
    </div>

      <div class="row">
        <div class="row-key">сводка</div>
        <div class="row-val">
          <div class="gallery-stats" id="galleryStats"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="wrapper">
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<footer class="ft">
  <div class="wrapper">
    <div class="ft-l">страница Вируса, <span id="year"></span></div>
    <div class="ft-r">сделано с .html</div>
  </div>
</footer>

<div id="lightbox">
  <span class="close-btn">&times;</span>
  <div class="lightbox-content">
    <img src="" alt="Увеличенное фото" id="lightboxImg" />
    <div class="lightbox-comment" id="lightboxComment"></div>
  </div>
</div>

<script type="module">
document.getElementById("year").textContent = new Date().getFullYear();

import { galleryData } from "./gallery-data.js";

const grid = document.getElementById("galleryGrid");
const searchInput = document.getElementById("searchInput");
const counter = document.getElementById("photoCounter");

let activeGame = "";

const gameLabels = {
  minecraft:"Minecraft",
  roblox:"Roblox",
  phasmo:"Phasmophobia",
  rivals:"Marvel Rivals",
  dbd:"Dead by Daylight",
  irl:"IRL"
};

function renderStats(){
  let counts={};
  galleryData.forEach(item=>{
    counts[item.game] = (counts[item.game] || 0)+1;
  });

  let sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  let top = sorted.length ? gameLabels[sorted[0][0]] : "-";

  document.getElementById("galleryStats").innerHTML = `
    <div class="stat-chip">
      <span class="stat-num">${galleryData.length}</span>
      <span class="stat-label">фото</span>
    </div>
    <div class="stat-chip">
      <span class="stat-num">${Object.keys(counts).length}</span>
      <span class="stat-label">категорий</span>
    </div>
    <div class="stat-chip">
      <span class="stat-num">${top}</span>
      <span class="stat-label">чаще всего</span>
    </div>
  `;
}

function escapeHtml(str){
  return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escapeRegExp(str){
  return (str || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// подсвечиваем совпадения так же, как в ленте постов
function highlight(text, query){
  const safe = escapeHtml(text);
  if(!query) return safe;
  return safe.replace(new RegExp(escapeRegExp(query), "gi"), match => `<mark>${match}</mark>`);
}

function getVisible(){
  let query = searchInput.value.toLowerCase().trim();

  return galleryData.filter(item=>{
    if(activeGame && item.game!==activeGame) return false;
    if(query && !item.comment.toLowerCase().includes(query)) return false;
    return true;
  });
}

function render(){
  let items = getVisible();
  const rawQuery = searchInput.value.trim();
  const fragment = document.createDocumentFragment();

  items.forEach((item, index)=>{
    let card = document.createElement("div");
    card.className = "gallery-item";
    card.dataset.comment = item.comment;
    // индекс нужен для ступенчатого появления после перемешивания;
    // выше 28 задержка не растёт — дальше карточки всё равно за экраном
    card.style.setProperty("--i", Math.min(index, 28));

    card.innerHTML = `
      <div class="gallery-thumb">
        <img src="${item.name}" loading="lazy" decoding="async" alt="${escapeHtml(gameLabels[item.game] + ": " + item.comment)}">
      </div>
      <div class="desc">
        <span class="card-tag">${gameLabels[item.game]}</span>
        <span>${highlight(item.comment, rawQuery)}</span>
      </div>
    `;

    fragment.appendChild(card);
  });

  grid.innerHTML = "";
  grid.appendChild(fragment);
  counter.textContent = `Показано: ${items.length} / ${galleryData.length}`;
}

searchInput.addEventListener("input", render);

document.querySelectorAll(".game-filter").forEach(button=>{
  button.onclick = ()=>{
    document.querySelectorAll(".game-filter").forEach(x=>x.classList.remove("active"));

    if(activeGame===button.dataset.game){
      activeGame = "";
      document.querySelector('[data-game=""]').classList.add("active");
    } else {
      activeGame = button.dataset.game;
      button.classList.add("active");
    }

    render();
  };
});

const shuffleButton = document.getElementById("shuffleButton");

shuffleButton.onclick = ()=>{
  if (shuffleButton.disabled) return;
  shuffleButton.disabled = true;

  // сначала карточки разлетаются, и только потом меняется порядок,
  // иначе перестановка происходит мгновенно и её не видно
  grid.classList.add("is-shuffling");

  setTimeout(()=>{
    galleryData.sort(()=>Math.random()-0.5);
    render();
    grid.classList.remove("is-shuffling");
    shuffleButton.disabled = false;
  }, 260);
};

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const comment = document.getElementById("lightboxComment");

grid.onclick = e=>{
  let card = e.target.closest(".gallery-item");
  if(!card) return;

  let img = card.querySelector("img");
  lightboxImg.src = img.src;
  comment.textContent = card.dataset.comment;

  lightbox.classList.add("active");
};

document.querySelector(".close-btn").onclick = ()=>{
  lightbox.classList.remove("active");
};

lightbox.onclick = e=>{
  if(e.target===lightbox) lightbox.classList.remove("active");
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) {
    lightbox.classList.remove('active');
  }
});

renderStats();
render();
</script>
  <script type="module" src="/lightbox-zoom.js"></script>
<script defer src="/_vercel/insights/script.js"></script>

<script src="/analytics-tracker.js"></script>
</body>
</html>
