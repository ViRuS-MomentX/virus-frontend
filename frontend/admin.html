<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Админ панель</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 24px;
    }
    h1 { font-size: 20px; margin-bottom: 16px; }
    #login-box {
      max-width: 320px;
      margin-top: 80px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
    #login-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #c9d1d9;
      font-size: 14px;
      margin-bottom: 12px;
    }
    #login-box button, #refresh-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    #login-box button:hover, #refresh-btn:hover { background: #2ea043; }
    #error-msg { color: #f85149; font-size: 13px; margin-top: 8px; min-height: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #21262d; white-space: nowrap; }
    th { color: #8b949e; font-weight: 600; }
    tr:hover { background: #161b22; }
    #toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    #refresh-btn { width: auto; padding: 8px 16px; }
    #hidden-content { display: none; }
    #status { color: #8b949e; font-size: 13px; margin-bottom: 12px; }
    #summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .card {
      flex: 1 1 240px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .card h2 { font-size: 12px; color: #8b949e; font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
    .card ul { list-style: none; margin: 0; padding: 0; }
    .card li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 13px; }
    .card li b { color: #e3b341; font-variant-numeric: tabular-nums; }
    .card li span { color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="login-box">
    <h1>🔒 Аналитика посещений</h1>
    <input type="password" id="key-input" placeholder="Введите ключ доступа" />
    <button onclick="login()">Войти</button>
    <div id="error-msg"></div>
  </div>
  <div id="hidden-content">
    <div id="toolbar">
      <h1>Аналитика virus</h1>
      <button id="refresh-btn" onclick="loadVisits()">Обновить</button>
    </div>
    <div id="status"></div>
    <div id="summary"></div>
    <table>
      <thead>
        <tr>
          <th>Время</th><th>IP</th><th>Страна</th><th>Регион</th><th>Город</th>
          <th>Источник</th><th>Язык</th><th>Устройство</th><th>ОС</th><th>Браузер</th><th>Страница</th>
        </tr>
      </thead>
      <tbody id="visits-body"></tbody>
    </table>
  </div>
  <script>
    var BACKEND_URL = 'https://virus-backend-nine.vercel.app/api/analytics/visits';
    var STORAGE_KEY = 'analytics_admin_key';

    function formatTime(iso) {
      var d = new Date(iso);
      return d.toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '—';
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function countryFlag(code) {
      if (!code || code.length !== 2) return '';
      var base = 127397;
      var upper = code.toUpperCase();
      return String.fromCodePoint(base + upper.charCodeAt(0), base + upper.charCodeAt(1));
    }

    function renderVisits(visits) {
      var body = document.getElementById('visits-body');
      body.innerHTML = '';
      visits.forEach(function (v) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + formatTime(v.visited_at) + '</td>' +
          '<td>' + escapeHtml(v.ip) + '</td>' +
          '<td>' + countryFlag(v.country) + ' ' + escapeHtml(v.country) + '</td>' +
          '<td>' + escapeHtml(v.region) + '</td>' +
          '<td>' + escapeHtml(v.city) + '</td>' +
          '<td>' + escapeHtml(v.source) + '</td>' +
          '<td>' + escapeHtml(v.lang) + '</td>' +
          '<td>' + escapeHtml(v.device) + '</td>' +
          '<td>' + escapeHtml(v.os) + '</td>' +
          '<td>' + escapeHtml(v.browser) + '</td>' +
          '<td>' + escapeHtml(v.page) + '</td>';
        body.appendChild(tr);
      });
      renderSummary(visits);
      document.getElementById('status').textContent = 'Всего записей: ' + visits.length;
    }

    // Считаем, сколько визитов пришло с каждого источника и на каком языке.
    function tally(visits, key, fallback) {
      var counts = {};
      visits.forEach(function (v) {
        var val = v[key] || fallback;
        counts[val] = (counts[val] || 0) + 1;
      });
      return Object.keys(counts)
        .map(function (k) { return { label: k, n: counts[k] }; })
        .sort(function (a, b) { return b.n - a.n; });
    }

    function cardHtml(title, rows) {
      var items = rows.map(function (r) {
        return '<li><span>' + escapeHtml(r.label) + '</span><b>' + r.n + '</b></li>';
      }).join('');
      return '<div class="card"><h2>' + title + '</h2><ul>' + (items || '<li><span>—</span></li>') + '</ul></div>';
    }

    function renderSummary(visits) {
      var box = document.getElementById('summary');
      if (!visits.length) { box.innerHTML = ''; return; }
      box.innerHTML =
        cardHtml('Источники', tally(visits, 'source', 'Прямой')) +
        cardHtml('Языки', tally(visits, 'lang', '—')) +
        cardHtml('Устройства', tally(visits, 'device', '—'));
    }

    function loadVisits() {
      var key = sessionStorage.getItem(STORAGE_KEY);
      if (!key) return;
      document.getElementById('status').textContent = 'Загрузка...';
      fetch(BACKEND_URL, { headers: { 'x-admin-key': key } })
        .then(function (res) {
          if (res.status === 401) {
            sessionStorage.removeItem(STORAGE_KEY);
            showLogin('Неверный ключ доступа');
            throw new Error('unauthorized');
          }
          if (!res.ok) throw new Error('Ошибка сервера: ' + res.status);
          return res.json();
        })
        .then(renderVisits)
        .catch(function (err) {
          if (err.message !== 'unauthorized') {
            document.getElementById('status').textContent = 'Ошибка: ' + err.message;
          }
        });
    }

    function showLogin(errorText) {
      document.getElementById('login-box').style.display = 'block';
      document.getElementById('hidden-content').style.display = 'none';
      document.getElementById('error-msg').textContent = errorText || '';
    }

    function showContent() {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('hidden-content').style.display = 'block';
    }

    function login() {
      var key = document.getElementById('key-input').value.trim();
      if (!key) return;
      sessionStorage.setItem(STORAGE_KEY, key);
      showContent();
      loadVisits();
    }

    document.getElementById('key-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') login();
    });

    (function init() {
      var savedKey = sessionStorage.getItem(STORAGE_KEY);
      if (savedKey) { showContent(); loadVisits(); } else { showLogin(); }
    })();
  </script>
</body>
</html>
